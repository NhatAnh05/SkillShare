<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Hoàn tất đặt lịch · Skill Rental
  </title>
  <th:block th:replace="~{fragments :: customerStyles}"></th:block>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
 </head>
 <body class="public-page">
  <div th:replace="~{fragments :: icons}">
  </div>
  <div th:replace="~{fragments :: header}">
  </div>
  <main class="page">
   <div class="container public-content">
    <div class="booking-stepper">
     <div class="is-done">
      <b>
       ✓
      </b>
      <span>
       Chọn lịch
      </span>
     </div>
     <span>
      →
     </span>
     <div class="is-done">
      <b>
       ✓
      </b>
      <span>
       Giữ tiền
      </span>
     </div>
     <span>
      →
     </span>
     <div class="is-current">
      <b>
       3
      </b>
      <span>
       Hoàn tất
      </span>
     </div>
    </div>
    <section class="card empty-state">
     <h1>
      Đã ghi nhận đặt lịch
     </h1>
     <p class="muted" th:text="${'Mã đơn: #SR-' + order.id}">
     </p>
     <p th:text="${order.booking.serviceName}">
     </p>
     <p class="alert success" th:if="${escrow != null}"
        th:text="${'Đã khóa tạm ' + #numbers.formatDecimal(escrow.totalAmount,0,'POINT',0,'COMMA') + 'đ trong ví. Chưa thanh toán ngay cho Provider.'}">
     </p>
     <p class="muted" th:if="${walletBalance != null}"
        th:text="${'Số dư khả dụng còn lại: ' + #numbers.formatDecimal(walletBalance,0,'POINT',0,'COMMA') + 'đ.'}">
     </p>
     <p class="muted">
      Bước tiếp theo: cả hai bên xác nhận bắt đầu để Provider nhận tạm ứng 1/3.
      Sau khi Provider báo hoàn thành, bạn nghiệm thu và nhập OTP để tất toán phần còn lại.
     </p>
     <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <a class="btn btn-primary" th:href="@{/orders/{id}/progress(id=${order.id})}">
       Xem tiến độ đơn hàng
      </a>
      <a class="btn btn-secondary" th:href="@{/orders}">
       Đơn hàng của tôi
      </a>
     </div>
    </section>
   </div>
  </main>
  <div th:replace="~{fragments :: footer}">
  </div>
  <div th:replace="~{fragments :: floatingChat}">
  </div>
  <script defer="" th:src="@{/js/app.js}">
  </script>
  <script defer="" th:src="@{/js/figma-ui.js}">
  </script>
 </body>
</html>
