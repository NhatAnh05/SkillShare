<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Quên mật khẩu · Skill Rental
  </title>
  <th:block th:replace="~{fragments :: customerStyles}"></th:block>
 </head>
 <body>
  <div class="auth">
   <div class="auth-art">
    <h1>
     Khôi phục quyền truy cập.
    </h1>
    <p>
     Demo hiển thị token reset trực tiếp thay vì gửi email.
    </p>
   </div>
   <div class="auth-box">
    <div class="auth-card">
     <h1>
      Quên mật khẩu
     </h1>
     <div th:replace="~{fragments :: flash}">
     </div>
     <form action="/forgot-password" method="post" th:if="${token==null}">
      <div class="form-group">
       <label>
        Email
       </label>
       <input class="input" name="email" required="" type="email"/>
      </div>
      <button class="btn btn-primary" style="width:100%">
       Gửi liên kết
      </button>
     </form>
     <form action="/reset-password" method="post" th:if="${token!=null}">
      <input name="token" th:value="${token}" type="hidden"/>
      <div class="alert success">
       Token demo:
       <span th:text="${token}">
       </span>
      </div>
      <div class="form-group">
       <label>
        Mật khẩu mới
       </label>
       <input class="input" name="newPassword" type="password"/>
      </div>
      <div class="form-group">
       <label>
        Xác nhận
       </label>
       <input class="input" name="confirmPassword" type="password"/>
      </div>
      <button class="btn btn-primary" style="width:100%">
       Đặt lại mật khẩu
      </button>
     </form>
     <p>
      <a href="/login" style="color:var(--primary)">
       ← Đăng nhập
      </a>
     </p>
    </div>
   </div>
  </div>
 </body>
</html>
