<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xác thực KYC · Skill Rental</title><th:block th:replace="~{fragments :: customerStyles}"></th:block></head><body class="management-page"><div th:replace="~{fragments :: icons}"></div><main class="page"><div class="container layout management-layout"><div th:replace="~{fragments :: sidebar}"></div><section class="page-content customer-workspace-content"><div class="workspace-topline"><a th:href="@{/settings}">Cài đặt</a><span>/</span><span>Xác thực KYC</span></div><h1 class="title">Xác thực danh tính (KYC demo)</h1><p class="muted">Biểu mẫu minh họa luồng gửi hồ sơ. Không tải lên hoặc lưu giấy tờ ở phiên bản này.</p><div th:replace="~{fragments :: flash}"></div><div class="notice notice-warning"><strong>Chưa xác thực</strong><p>Thông tin gửi qua biểu mẫu chưa được lưu thành hồ sơ KYC và không xác minh danh tính thật. Trạng thái “Chờ xét duyệt” chỉ mang tính minh họa.</p></div><form class="card preference-form" method="post" th:action="@{/settings/kyc}"><div class="form-group"><label for="legalName">Họ tên trên giấy tờ</label><input class="input" id="legalName" name="legalName" maxlength="120" required></div><div class="form-group"><label for="idNumber">Số giấy tờ</label><input class="input" id="idNumber" name="idNumber" maxlength="40" required></div><button class="btn btn-primary" type="submit">Gửi thông tin demo</button></form></section></div></main><script defer th:src="@{/js/app.js}"></script></body></html>
