<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Chi tiết khiếu nại</title><th:block th:replace="~{fragments :: customerStyles}"></th:block></head><body><div th:replace="~{fragments :: icons}"></div><header th:replace="~{fragments :: header}"></header><main class="container policy-page card"><h1 th:text="${'Khiếu nại #' + complaint.id + ': ' + complaint.subject}"></h1><p th:text="${complaint.description}" class="policy-paragraph"></p><p th:text="${'Trạng thái: ' + complaint.status}"></p><p th:text="${complaint.handledBy != null ? 'Người phụ trách: ' + complaint.handledBy.fullName : 'Chưa phân công'}"></p><h2>Phản hồi của Admin</h2><p class="policy-paragraph" th:text="${complaint.resolutionNotes != null ? complaint.resolutionNotes : 'Chưa có phản hồi.'}"></p><div th:if="${currentUser.role.name() == 'ADMIN'}"><form method="post" th:action="@{/admin/complaints/{id}/claim(id=${complaint.id})}"><button class="btn" type="submit">Tiếp nhận xử lý</button></form><a href="/admin/support-reviews" class="btn">Yêu cầu quyền xem bằng chứng chat</a></div><a href="/orders">Về danh sách đơn</a></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: floatingChat}"></div><script defer src="/js/app.js"></script><script defer src="/js/workflow.js"></script></body></html>
