spring.application.name=skill-rental
server.port=8080
spring.datasource.url=jdbc:h2:mem:skillrental;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# --- Wallet / escrow / OTP (demo defaults) ---
# OTP is emailed when SMTP is configured. Leave spring.mail.host blank to fall back to log + on-screen demo code.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# Payment OTP. Set APP_OTP_EXPOSE=false in production so the code is only delivered by email.
app.otp.expiry-minutes=${APP_OTP_EXPIRY_MINUTES:5}
app.otp.expose=${APP_OTP_EXPOSE:true}

# --- Escrow timeout policies (days). Set a value to 0 to make the sweep resolve such orders immediately (useful for demo/testing). ---
app.escrow.hold-expiry-days=${APP_ESCROW_HOLD_EXPIRY_DAYS:7}
app.escrow.confirm-expiry-days=${APP_ESCROW_CONFIRM_EXPIRY_DAYS:3}
app.escrow.cancel-response-days=${APP_ESCROW_CANCEL_RESPONSE_DAYS:3}
