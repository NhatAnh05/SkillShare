# Production guardrails: real money workflows require a trusted payment/top-up provider.
skillshare.wallet.demo-topup-enabled=false
skillshare.escrow.show-demo-otp=false
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
# Set VNPAY_TMN_CODE, VNPAY_HASH_SECRET, VNPAY_RETURN_URL and Gmail app-password env vars externally.
skillshare.vnpay.tmn-code=${VNPAY_TMN_CODE:}
skillshare.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
skillshare.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
skillshare.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/customer/wallet/vnpay/return}
# Configure public HTTPS IPN endpoint in the VNPay merchant dashboard:
# https://your-public-domain/customer/wallet/vnpay/ipn (never localhost for external callbacks).
# Browser return is display-only; only signed IPN updates the wallet.

# Fail closed unless the antivirus daemon is available for private uploads.
skillshare.files.clamav-required=true
