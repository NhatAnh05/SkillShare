<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Hồ sơ khách hàng · Skill Rental
  </title>
  <th:block th:replace="~{fragments :: customerStyles}"></th:block>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
 </head>
 <body>
  <div th:replace="~{fragments :: icons}">
  </div>
  <main class="page">
   <div class="container layout management-layout">
    <div th:replace="~{fragments :: sidebar}">
    </div>
    <section class="page-content">
     <h1 class="title">
      Hồ sơ khách hàng
     </h1>
     <p class="muted">
      Xem và sửa họ tên, email, điện thoại, ảnh đại diện, giới thiệu.
     </p>
     <div th:replace="~{fragments :: flash}">
     </div>
     <form class="card" method="post" style="margin-top:20px" th:action="@{/profile}" th:object="${form}">
      <div class="row">
       <div class="form-group">
        <label>
         Họ tên
        </label>
        <input class="input" th:field="*{fullName}"/>
       </div>
       <div class="form-group">
        <label>
         Email
        </label>
        <input class="input" th:field="*{email}" type="email"/>
       </div>
       <div class="form-group">
        <label>
         Điện thoại
        </label>
        <input class="input" th:field="*{phone}"/>
       </div>
       <div class="form-group">
        <label>
         Liên kết ảnh đại diện
        </label>
        <input class="input" th:field="*{avatarUrl}"/>
       </div>
      </div>
      <div class="form-group">
       <label>
        Giới thiệu
       </label>
       <textarea class="textarea" th:field="*{bio}"></textarea>
      </div>
      <button class="btn btn-primary">
       Lưu thay đổi
      </button>
     </form>
    </section>
   </div>
  </main>
  <div th:replace="~{fragments :: footer}">
  </div>
  <div th:replace="~{fragments :: floatingChat}">
  </div>
  <script defer="" src="/js/app.js">
  </script>
 </body>
</html>
