<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh mục dịch vụ · SkillShare</title><th:block th:replace="~{fragments :: customerStyles}"></th:block></head>
<body><div th:replace="~{fragments :: icons}"></div><div th:replace="~{fragments :: header}"></div>
<main class="page"><div class="container"><div class="section-heading"><div><h1 class="title">Danh mục dịch vụ</h1><p class="muted">Chọn các dịch vụ đang được Provider công khai.</p></div><a class="btn btn-outline" th:href="@{/cart}">Danh sách đã chọn</a></div><div th:replace="~{fragments :: flash}"></div>
<div class="request-grid" th:if="${!#lists.isEmpty(services)}"><article class="request-card" th:each="service : ${services}"><div class="request-top"><h3 th:text="${service.name}">Tên dịch vụ</h3><span class="request-status" th:text="${service.category}">Danh mục</span></div><p th:text="${service.description}">Mô tả</p><div class="request-meta"><span>Provider: <strong th:text="${service.provider.fullName}">Provider</strong></span><span>Đánh giá: <strong th:text="${service.rating + ' ★'}">0 ★</strong></span></div><div class="request-bottom"><strong th:text="${#numbers.formatDecimal(service.price,0,'POINT',0,'COMMA') + 'đ'}">0đ</strong><form method="post" th:action="@{/cart/items}"><input type="hidden" name="serviceId" th:value="${service.id}"><label>Số lượng <input class="input" type="number" name="quantity" min="1" max="99" value="1" style="width:80px"></label><button class="btn btn-primary btn-sm" type="submit">Thêm vào danh sách</button></form></div></article></div>
<div class="request-board-empty" th:if="${#lists.isEmpty(services)}"><strong>Chưa có dịch vụ công khai</strong><span>Dịch vụ sẽ hiển thị tại đây khi Provider đăng và được xuất bản.</span></div></div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{fragments :: floatingChat}"></div><script defer th:src="@{/js/app.js}"></script></body></html>
