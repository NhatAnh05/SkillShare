<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Tạo Request · Skill Rental
  </title>
  <th:block th:replace="~{fragments :: customerStyles}"></th:block>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
 </head>
 <body>
  <div th:replace="~{fragments :: icons}">
  </div>
  <main class="page">
   <div class="container layout management-layout">
    <div th:replace="~{fragments :: sidebar}">
    </div>
    <section class="page-content">
     <h1 class="title">
      Tạo Request
     </h1>
     <p class="muted">
      Tiêu đề, kỹ năng, mô tả, ngân sách, hạn hoàn thành.
     </p>
     <form class="card" method="post" style="margin-top:20px" th:action="@{/requests}" th:object="${form}">
      <div class="form-group">
       <label>
        Tiêu đề
       </label>
       <input class="input" th:field="*{title}"/>
      </div>
      <div class="form-group">
       <label>
        Kỹ năng yêu cầu
       </label>
       <input class="input" th:field="*{requiredSkills}"/>
      </div>
      <div class="form-group">
       <label>
        Mô tả
       </label>
       <textarea class="textarea" th:field="*{description}"></textarea>
      </div>
      <div class="row">
       <div class="form-group">
        <label>
         Ngân sách
        </label>
        <input class="input" th:field="*{budget}" type="number"/>
       </div>
       <div class="form-group">
        <label>
         Hạn hoàn thành
        </label>
        <input class="input" th:field="*{deadline}" type="date"/>
       </div>
      </div>
      <button class="btn btn-primary">
       Đăng yêu cầu
      </button>
     </form>
    </section>
   </div>
  </main>
  <div th:replace="~{fragments :: footer}">
  </div>
  <div th:replace="~{fragments :: floatingChat}">
  </div>
  <script defer="" src="/js/app.js">
  </script>
 </body>
</html>
