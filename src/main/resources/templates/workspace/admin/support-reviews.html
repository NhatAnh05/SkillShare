<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Quyền xem chat khiếu nại</title><th:block th:replace="~{fragments :: customerStyles}"></th:block></head><body><div th:replace="~{fragments :: icons}"></div><header th:replace="~{fragments :: header}"></header><main class="container policy-page card" id="support-review-page" th:attr="data-can-approve=${canApprove}"><a href="/admin/support">← Hộp thư hỗ trợ</a><h1>Quyền xem chat khiếu nại</h1><p>Cần được phân công khiếu nại và một Admin khác có quyền duyệt chấp thuận. Quyền xem tối đa 2 giờ, phạm vi tối đa 31 ngày; chỉ đọc, mọi truy cập được ghi nhận. Xuất dữ liệu cần được duyệt riêng và nhập lý do.</p><form id="review-request" class="document-compose"><label>Mã hội thoại riêng<input type="number" name="conversationId" min="1" required/></label><label>Mã khiếu nại được phân công<input type="number" name="complaintId" min="1" required/></label><label>Lý do<textarea name="reason" required maxlength="2000"></textarea></label><label>Từ thời điểm<input type="datetime-local" name="from" required/></label><label>Đến thời điểm<input type="datetime-local" name="to" required/></label><button type="submit" class="btn btn-primary">Yêu cầu quyền xem</button></form><p id="review-status" role="status"></p><div id="review-list" class="document-list"></div><section id="review-content" aria-live="polite"></section></main><div th:replace="~{fragments :: footer}"></div><script defer src="/js/app.js"></script>
<script defer src="/js/workflow.js"></script></body></html>
