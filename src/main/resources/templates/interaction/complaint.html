<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Báo cáo Customer / Provider · SkillShare
  </title>
  <th:block th:replace="~{fragments :: customerStyles}"></th:block>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
 </head>
 <body>
  <div th:replace="~{fragments :: icons}">
  </div>
  <main class="page">
   <div class="container layout management-layout">
    <div th:replace="~{fragments :: sidebar}">
    </div>
    <section class="page-content">
     <div class="section-top">
      <div>
       <h1 class="title">
        Báo cáo Customer / Provider
       </h1>
       <p class="muted">
        Đơn hàng
        <strong th:text="${'#SR-'+order.id}">
        </strong>
        · Người báo cáo:
        <strong th:text="${reporter.fullName}">Người gửi</strong>
        · Đối tượng bị báo cáo:
        <strong th:text="${reportedUser.fullName}">Người bị báo cáo</strong>
       </p>
      </div>
      <a class="btn btn-secondary" th:href="@{/orders}">
       Quay lại đơn hàng
      </a>
     </div>
     <div class="alert danger" style="max-width:650px">
      Báo cáo sẽ được ghi vào cơ sở dữ liệu và gửi tới Admin để xem xét. Báo cáo không tự động quyết định hoàn tiền hoặc khóa tài khoản.
     </div>
     <form class="card" method="post" style="max-width:650px" th:action="@{/orders/{id}/complaint(id=${order.id})}" th:object="${complaintForm}">
      <div class="form-group">
       <label for="complaint-subject">
        Chủ đề báo cáo
       </label>
       <input class="input" id="complaint-subject" maxlength="180" placeholder="Ví dụ: Chưa nhận được dịch vụ" required="" th:field="*{subject}"/>
       <div class="error" th:errors="*{subject}">
       </div>
      </div>
      <div class="form-group">
       <label for="complaint-description">
        Chi tiết báo cáo
       </label>
       <textarea class="textarea" id="complaint-description" maxlength="2500" placeholder="Mô tả diễn biến và vấn đề bạn gặp phải..." required="" th:field="*{description}"></textarea>
       <div class="error" th:errors="*{description}">
       </div>
      </div>
      <button class="btn btn-danger" type="submit">
       Báo cáo Customer / Provider
      </button>
     </form>
    </section>
   </div>
  </main>
  <div th:replace="~{fragments :: footer}">
  </div>
  <div th:replace="~{fragments :: floatingChat}">
  </div>
  <script defer="" src="/js/app.js">
  </script>
 </body>
</html>
