<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
 <body>
  <div class="chat-widget" data-widget="" id="chat-widget" th:if="${currentUser != null}" th:data-current-user-id="${currentUser == null ? 0 : currentUser.id}" th:data-current-role="${currentUser == null ? '' : currentUser.role}" th:fragment="widget">
   <button aria-controls="chat-popup" aria-expanded="false" aria-label="Mở tin nhắn" class="chat-fab" id="chat-fab" type="button">
    <svg class="icon">
     <use href="#i-chat">
     </use>
    </svg>
    <span class="chat-fab-label">
     Tin nhắn
    </span>
    <span aria-label="Tin nhắn chưa đọc" class="chat-fab-count" hidden id="chat-unread-count">0</span>
   </button>
   <section aria-label="Tin nhắn với Provider" aria-modal="false" class="chat-popup" hidden="" id="chat-popup" role="dialog">
    <div class="chat-popup-head">
     <strong>
      Tin nhắn
     </strong>
     <button class="chat-support-start" id="chat-support-start" type="button" th:if="${currentUser.role.name() != 'ADMIN'}">Hỗ trợ</button>
     <button aria-label="Đóng tin nhắn" class="icon-button" id="chat-close" type="button">
      <svg class="icon">
       <use href="#i-x">
       </use>
      </svg>
     </button>
    </div>
    <div class="chat-popup-body">
     <div aria-label="Cuộc trò chuyện" class="chat-contacts" id="chat-contacts">
     </div>
     <div class="chat-pane">
      <div class="chat-peer" id="chat-peer">
       Chọn cuộc trò chuyện
      </div>
      <a class="chat-order-link" id="chat-order-link" hidden>Đơn hàng liên quan</a>
      <button type="button" id="chat-load-older" class="link-button" hidden>Tải tin nhắn cũ hơn</button>
      <div aria-live="polite" class="chat-history" id="chat-history">
      </div>
      <button type="button" id="chat-new-messages" class="link-button" hidden>Tin nhắn mới ↓</button>
      <details class="chat-documents" id="chat-documents" hidden><summary>Tài liệu cũ (chỉ xem)</summary>
       <div id="chat-document-list" class="document-list"></div><button id="chat-document-more" type="button" class="link-button" hidden>Tải thêm tài liệu</button>
       <p class="muted">Lịch sử tài liệu cũ chỉ để xem lại. Gửi tài liệu và bàn giao sản phẩm tại trang đơn hàng.</p>
      </details>
      <form class="chat-compose" id="chat-send-form">
       <input aria-label="Nội dung tin nhắn" class="input" maxlength="2500" name="content" placeholder="Nhập tin nhắn..." required=""/>
       <button class="btn btn-primary btn-sm" type="submit">
        Gửi
       </button>
      </form>
     </div>
    </div>
    <p class="chat-feedback" hidden="" id="chat-feedback" role="status">
    </p>
   </section>
  </div>
 </body>
</html>
