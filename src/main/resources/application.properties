spring.application.name=skill-rental
server.port=8080
spring.datasource.url=jdbc:h2:mem:skillrental;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# Gmail SMTP: use the Gmail address and a Google App Password (not the normal account password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SKILLSHARE_MAIL_USERNAME:}
spring.mail.password=${SKILLSHARE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# One commission policy shared by Provider wallet, escrow settlement and Admin finance (5% of the settled amount).
# Example: 0.05 = 5%; use the same property in all environments.
skillshare.commission.rate=0.05

# Local demo OTP is shown on screen when SMTP is missing. Set false only when SMTP is configured and tested.
skillshare.escrow.show-demo-otp=false
skillshare.wallet.demo-topup-enabled=false

# VNPay Sandbox wallet top-up. Get these credentials from the VNPay Sandbox merchant portal.
skillshare.vnpay.tmn-code=${VNPAY_TMN_CODE:}
skillshare.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
skillshare.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
skillshare.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/customer/wallet/vnpay/return}

# Public base URL used to build email verification/reset links. Override in deployed environments.
app.base-url=${SKILLSHARE_BASE_URL:http://localhost:8080}

# Google OAuth credentials are read from GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET environment variables.
