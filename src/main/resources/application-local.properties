# Local development only: preserve messages/notifications between application restarts.
# Production uses the mysql profile and reviewed SQL migrations with ddl-auto=validate.
spring.datasource.url=jdbc:h2:file:./data/skillshare;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Local console is restricted to loopback and additionally requires an authenticated Admin.
server.address=127.0.0.1
spring.h2.console.enabled=true
